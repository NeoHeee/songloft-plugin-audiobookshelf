name: Build test plugin

on:
  push:
    branches:
      - agent/first-testable-version
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate package
        run: |
          work_dir="$(mktemp -d)"
          unzip -q dist/audiobookshelf.jsplugin.zip -d "$work_dir"
          npx songloft-plugin validate "$work_dir"
      - uses: actions/upload-artifact@v4
        with:
          name: audiobookshelf-v0.3.0-test
          path: dist/audiobookshelf.jsplugin.zip
          if-no-files-found: error
