name: Build test plugin

on:
  push:
    branches:
      - agent/abs-cover-proxy
    paths-ignore:
      - dist/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: node --check static/js/app.js
      - run: npm run build
      - name: Verify embedded version
        run: |
          work_dir="$(mktemp -d)"
          unzip -q dist/audiobookshelf.jsplugin.zip -d "$work_dir"
          test "$(node -p "require('$work_dir/plugin.json').version")" = "0.9.2-beta.3"
          sha256sum dist/audiobookshelf.jsplugin.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: audiobookshelf-v0.9.2-beta.3-test
          path: dist/audiobookshelf.jsplugin.zip
          if-no-files-found: error
      - name: Publish new prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.9.2-beta.3 dist/audiobookshelf.jsplugin.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "ABS书库 v0.9.2-beta.3 · 导入内容清理预览版" \
            --notes-file RELEASE-NOTES.md
