name: Build test plugin

on:
  push:
    branches:
      - agent/first-testable-version
    paths-ignore:
      - dist/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify embedded version
        run: |
          work_dir="$(mktemp -d)"
          unzip -q dist/audiobookshelf.jsplugin.zip -d "$work_dir"
          test "$(node -p "require('$work_dir/plugin.json').version")" = "0.4.0"
      - uses: actions/upload-artifact@v4
        with:
          name: audiobookshelf-v0.4.0-test
          path: dist/audiobookshelf.jsplugin.zip
          if-no-files-found: error
      - name: Publish verified package to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/audiobookshelf.jsplugin.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified v0.4.0 package"
            git push
          fi
      - name: Create or update v0.4.0 prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            gh release upload v0.4.0 dist/audiobookshelf.jsplugin.zip --clobber
          else
            gh release create v0.4.0 dist/audiobookshelf.jsplugin.zip \
              --target agent/first-testable-version \
              --prerelease \
              --title "Audiobookshelf 插件 v0.4.0 测试版" \
              --notes "搜索优化与继续播放定位合并测试版。安装包构建成功，并确认内部版本为 0.4.0。"
          fi
