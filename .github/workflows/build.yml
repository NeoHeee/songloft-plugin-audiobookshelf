name: Build test plugin

on:
  push:
    branches:
      - agent/audiobookshelf-v0.9.0
    paths-ignore:
      - dist/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify embedded version
        run: |
          work_dir="$(mktemp -d)"
          unzip -q dist/audiobookshelf.jsplugin.zip -d "$work_dir"
          test "$(node -p "require('$work_dir/plugin.json').version")" = "0.9.0"
      - uses: actions/upload-artifact@v4
        with:
          name: audiobookshelf-v0.9.0-test
          path: dist/audiobookshelf.jsplugin.zip
          if-no-files-found: error
      - name: Publish verified package to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/audiobookshelf.jsplugin.zip
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified v0.9.0 package"
            git push
          fi
      - name: Create or update v0.9.0 prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.9.0 >/dev/null 2>&1; then
            gh release upload v0.9.0 dist/audiobookshelf.jsplugin.zip --clobber
          else
            gh release create v0.9.0 dist/audiobookshelf.jsplugin.zip \
              --target agent/audiobookshelf-v0.9.0 \
              --prerelease \
              --title "ABS书库插件 v0.9.0 测试版" \
              --notes "新增持久化播放历史、历史位置继续播放、本机与智能音箱来源区分，以及账号密码认证和新版令牌自动刷新；密码不会持久保存。安装包构建成功，并确认内部版本为 0.9.0。"
          fi
